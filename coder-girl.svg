<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <defs>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes blink {
        0%, 90%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.05); }
      }
      @keyframes type {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes glow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes steam {
        0% { transform: translateY(0) scaleX(1); opacity: 0.6; }
        100% { transform: translateY(-18px) scaleX(1.4); opacity: 0; }
      }
      .float-group { animation: float 3.5s ease-in-out infinite; transform-origin: center; }
      .eyes { animation: blink 4s ease-in-out infinite; transform-origin: center; }
      .cursor { animation: type 1s step-end infinite; }
      .screen-glow { animation: glow 2s ease-in-out infinite; }
      .steam1 { animation: steam 2s ease-out infinite; }
      .steam2 { animation: steam 2s ease-out 0.7s infinite; }
      .steam3 { animation: steam 2s ease-out 1.4s infinite; }
    </style>

    <!-- Screen gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>

    <!-- Desk gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5E3C"/>
      <stop offset="100%" style="stop-color:#6B3F1F"/>
    </linearGradient>

    <!-- Skin gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDDBB4"/>
      <stop offset="100%" style="stop-color:#F5C28A"/>
    </linearGradient>

    <!-- Hoodie gradient -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E63946"/>
      <stop offset="100%" style="stop-color:#B5232E"/>
    </linearGradient>

    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5efe6"/>
      <stop offset="100%" style="stop-color:#e8ddd0"/>
    </linearGradient>

    <!-- Screen glow filter -->
    <filter id="screenGlowFilter">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="420" rx="20" fill="url(#bgGrad)"/>

  <!-- Wall -->
  <rect x="0" y="0" width="400" height="270" rx="20" fill="#EDE0D4"/>

  <!-- Desk surface -->
  <rect x="0" y="268" width="400" height="152" rx="0" fill="url(#deskGrad)"/>
  <rect x="0" y="268" width="400" height="8" fill="#A0704A"/>

  <!-- === MONITOR === -->
  <!-- Monitor stand -->
  <rect x="170" y="230" width="18" height="40" rx="3" fill="#333"/>
  <rect x="148" y="265" width="62" height="8" rx="4" fill="#2a2a2a"/>

  <!-- Monitor body -->
  <rect x="60" y="60" width="240" height="175" rx="10" fill="#222" filter="url(#softShadow)"/>
  <!-- Screen -->
  <rect x="68" y="68" width="224" height="155" rx="6" fill="url(#screenGrad)"/>

  <!-- Screen glow -->
  <rect x="68" y="68" width="224" height="155" rx="6" fill="#4f8ef7" opacity="0.04" class="screen-glow"/>

  <!-- Code lines on screen -->
  <g font-family="'Courier New', monospace" font-size="7" fill="#4fc3f7">
    <text x="78" y="85">def solve(arr):</text>
    <text x="78" y="96" fill="#81c995">  for i in range(len(arr)):</text>
    <text x="78" y="107" fill="#ce93d8">    if arr[i] == target:</text>
    <text x="78" y="118" fill="#4fc3f7">      return i</text>
    <text x="78" y="129" fill="#f28b82">  return -1</text>
    <text x="78" y="140" fill="#aaa"># Python DSA</text>
    <text x="78" y="151" fill="#ffb74d">class Node:</text>
    <text x="78" y="162" fill="#81c995">  def __init__(self):</text>
    <text x="78" y="173" fill="#4fc3f7">    self.val = None</text>
    <text x="78" y="184" fill="#ce93d8">    self.next = None</text>
    <text x="78" y="200" fill="#fff" opacity="0.9">▊<animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/></text>
  </g>

  <!-- Syntax highlight bars (line numbers) -->
  <g fill="#ffffff11">
    <rect x="68" y="78" width="6" height="8" rx="1"/>
    <rect x="68" y="89" width="6" height="8" rx="1"/>
    <rect x="68" y="100" width="6" height="8" rx="1"/>
    <rect x="68" y="111" width="6" height="8" rx="1"/>
    <rect x="68" y="122" width="6" height="8" rx="1"/>
    <rect x="68" y="133" width="6" height="8" rx="1"/>
    <rect x="68" y="144" width="6" height="8" rx="1"/>
    <rect x="68" y="155" width="6" height="8" rx="1"/>
    <rect x="68" y="166" width="6" height="8" rx="1"/>
    <rect x="68" y="177" width="6" height="8" rx="1"/>
  </g>

  <!-- Lamp -->
  <rect x="310" y="100" width="6" height="90" rx="3" fill="#555"/>
  <rect x="300" y="98" width="60" height="6" rx="3" fill="#555" transform="rotate(-30, 330, 101)"/>
  <ellipse cx="335" cy="78" rx="28" ry="14" fill="#444" transform="rotate(-30, 335, 78)"/>
  <ellipse cx="335" cy="82" rx="18" ry="6" fill="#ffe08033" transform="rotate(-30, 335, 82)"/>

  <!-- Plant -->
  <rect x="44" y="238" width="22" height="28" rx="4" fill="#A0522D"/>
  <rect x="46" y="240" width="18" height="4" rx="1" fill="#8B4513"/>
  <!-- Leaves -->
  <ellipse cx="55" cy="225" rx="8" ry="18" fill="#4CAF50" transform="rotate(-15, 55, 225)"/>
  <ellipse cx="62" cy="220" rx="7" ry="16" fill="#388E3C" transform="rotate(15, 62, 220)"/>
  <ellipse cx="48" cy="222" rx="6" ry="14" fill="#66BB6A" transform="rotate(-30, 48, 222)"/>

  <!-- =========== FLOATING CHARACTER =========== -->
  <g class="float-group">

    <!-- Hoodie body (main) -->
    <path d="M 155 310 Q 148 280 145 265 Q 158 255 200 252 Q 242 255 255 265 Q 252 280 245 310 Z" fill="url(#hoodieGrad)"/>

    <!-- Arms -->
    <!-- Left arm -->
    <path d="M 148 268 Q 130 278 118 295 Q 115 305 122 308 Q 132 298 145 290 Q 148 282 150 272 Z" fill="url(#hoodieGrad)"/>
    <!-- Right arm (typing) -->
    <path d="M 252 268 Q 268 278 278 295 Q 282 306 275 309 Q 264 298 253 290 Q 250 282 250 272 Z" fill="url(#hoodieGrad)"/>

    <!-- Hands -->
    <!-- Left hand on keyboard -->
    <ellipse cx="121" cy="310" rx="11" ry="7" fill="url(#skinGrad)" transform="rotate(-15, 121, 310)"/>
    <!-- Right hand on keyboard -->
    <ellipse cx="276" cy="311" rx="11" ry="7" fill="url(#skinGrad)" transform="rotate(15, 276, 311)"/>
    <!-- Fingers left -->
    <rect x="112" y="307" width="5" height="7" rx="2" fill="url(#skinGrad)" transform="rotate(-10, 114, 310)"/>
    <rect x="118" y="306" width="5" height="8" rx="2" fill="url(#skinGrad)"/>
    <rect x="124" y="307" width="5" height="7" rx="2" fill="url(#skinGrad)" transform="rotate(10, 126, 310)"/>
    <!-- Fingers right -->
    <rect x="269" y="307" width="5" height="7" rx="2" fill="url(#skinGrad)" transform="rotate(-10, 271, 310)"/>
    <rect x="275" y="306" width="5" height="8" rx="2" fill="url(#skinGrad)"/>
    <rect x="281" y="307" width="5" height="7" rx="2" fill="url(#skinGrad)" transform="rotate(10, 283, 310)"/>

    <!-- Neck -->
    <rect x="192" y="242" width="16" height="16" rx="5" fill="url(#skinGrad)"/>

    <!-- Head -->
    <ellipse cx="200" cy="218" rx="42" ry="46" fill="url(#skinGrad)" filter="url(#softShadow)"/>

    <!-- Hair - back layer -->
    <ellipse cx="200" cy="185" rx="44" ry="22" fill="#1a1a1a"/>
    <!-- Hair sides long -->
    <path d="M 158 195 Q 148 230 152 255 Q 158 258 165 252 Q 162 228 168 205 Z" fill="#1a1a1a"/>
    <path d="M 242 195 Q 252 230 248 255 Q 242 258 235 252 Q 238 228 232 205 Z" fill="#1a1a1a"/>
    <!-- Hair top -->
    <path d="M 160 195 Q 165 160 200 155 Q 235 160 240 195 Q 220 185 200 185 Q 180 185 160 195 Z" fill="#1a1a1a"/>
    <!-- Hair strands -->
    <path d="M 165 185 Q 168 170 175 165" stroke="#2a2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 200 155 Q 202 148 205 145" stroke="#2a2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Hair flower pin -->
    <circle cx="228" cy="185" r="5" fill="#ff6b9d"/>
    <circle cx="228" cy="185" r="2.5" fill="#fff"/>
    <ellipse cx="223" cy="183" rx="3" ry="2" fill="#ff8fab" transform="rotate(-30, 223, 183)"/>
    <ellipse cx="233" cy="183" rx="3" ry="2" fill="#ff8fab" transform="rotate(30, 233, 183)"/>
    <ellipse cx="228" cy="179" rx="2" ry="3" fill="#ff8fab"/>
    <ellipse cx="228" cy="191" rx="2" ry="3" fill="#ff8fab"/>

    <!-- Ears -->
    <ellipse cx="158" cy="220" rx="7" ry="9" fill="url(#skinGrad)"/>
    <ellipse cx="242" cy="220" rx="7" ry="9" fill="url(#skinGrad)"/>

    <!-- === HEADPHONES === -->
    <!-- Headphone band -->
    <path d="M 160 200 Q 165 155 200 150 Q 235 155 240 200" stroke="#c0392b" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- Ear cups -->
    <ellipse cx="157" cy="213" rx="18" ry="20" fill="#c0392b"/>
    <ellipse cx="157" cy="213" rx="12" ry="14" fill="#1a1a1a"/>
    <ellipse cx="157" cy="213" rx="7" ry="8" fill="#2d2d2d"/>
    <ellipse cx="243" cy="213" rx="18" ry="20" fill="#c0392b"/>
    <ellipse cx="243" cy="213" rx="12" ry="14" fill="#1a1a1a"/>
    <ellipse cx="243" cy="213" rx="7" ry="8" fill="#2d2d2d"/>
    <!-- Hanging headphone -->
    <path d="M 185 258 Q 182 270 180 278" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="178" cy="282" rx="7" ry="9" fill="#1a1a1a"/>
    <ellipse cx="178" cy="282" rx="4" ry="5" fill="#333"/>

    <!-- Face features -->
    <!-- Eyebrows -->
    <path d="M 182 207 Q 188 204 194 206" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 206 206 Q 212 204 218 207" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Eyes with blink -->
    <g class="eyes">
      <!-- Left eye -->
      <ellipse cx="188" cy="216" rx="8" ry="9" fill="#1a1a1a"/>
      <ellipse cx="188" cy="216" rx="6" ry="7" fill="#3d2b1f"/>
      <ellipse cx="188" cy="216" rx="4" ry="4.5" fill="#1a1a1a"/>
      <circle cx="191" cy="213" r="2" fill="white" opacity="0.9"/>
      <circle cx="185" cy="219" r="1" fill="white" opacity="0.4"/>
      <!-- Right eye -->
      <ellipse cx="212" cy="216" rx="8" ry="9" fill="#1a1a1a"/>
      <ellipse cx="212" cy="216" rx="6" ry="7" fill="#3d2b1f"/>
      <ellipse cx="212" cy="216" rx="4" ry="4.5" fill="#1a1a1a"/>
      <circle cx="215" cy="213" r="2" fill="white" opacity="0.9"/>
      <circle cx="209" cy="219" r="1" fill="white" opacity="0.4"/>
    </g>

    <!-- Eyelashes -->
    <path d="M 180 210 L 178 207" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 196 210 L 197 207" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 204 210 L 203 207" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 220 210 L 222 207" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M 199 224 Q 200 228 202 224" stroke="#e0a882" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Mouth (slight focus expression) -->
    <path d="M 193 234 Q 200 237 207 234" stroke="#c47a5a" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Blush -->
    <ellipse cx="178" cy="229" rx="10" ry="5" fill="#ff9999" opacity="0.35"/>
    <ellipse cx="222" cy="229" rx="10" ry="5" fill="#ff9999" opacity="0.35"/>

    <!-- Hoodie hood detail -->
    <path d="M 165 260 Q 175 248 200 246 Q 225 248 235 260" stroke="#B5232E" stroke-width="2" fill="none"/>

    <!-- Hoodie pocket/strings -->
    <path d="M 192 280 Q 196 295 196 305" stroke="#c0392b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 208 280 Q 204 295 204 305" stroke="#c0392b" stroke-width="2" fill="none" stroke-linecap="round"/>

  </g>
  <!-- =========== END CHARACTER =========== -->

  <!-- Keyboard -->
  <rect x="100" y="305" width="195" height="28" rx="5" fill="#2a2a2a" filter="url(#softShadow)"/>
  <rect x="103" y="307" width="189" height="22" rx="4" fill="#333"/>
  <!-- Key rows -->
  <g fill="#444" rx="2">
    <!-- Row 1 -->
    <rect x="108" y="309" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="122" y="309" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="136" y="309" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="150" y="309" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="164" y="309" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="178" y="309" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="192" y="309" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="206" y="309" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="220" y="309" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="234" y="309" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="248" y="309" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="262" y="309" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <!-- Row 2 -->
    <rect x="108" y="319" width="40" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="150" y="319" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="164" y="319" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="178" y="319" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="192" y="319" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="206" y="319" width="12" height="7" rx="1.5" fill="#3a3a3a"/>
    <rect x="220" y="319" width="66" height="7" rx="1.5" fill="#3a3a3a"/>
  </g>

  <!-- Coffee cup -->
  <ellipse cx="350" cy="276" rx="22" ry="8" fill="#e8e0d0"/>
  <rect x="328" y="272" width="44" height="32" rx="4" fill="#f0ece4"/>
  <ellipse cx="350" cy="304" rx="22" ry="6" fill="#e0dbd0"/>
  <!-- Coffee liquid -->
  <ellipse cx="350" cy="274" rx="18" ry="5" fill="#4a2c0a"/>
  <!-- Cup handle -->
  <path d="M 372 278 Q 382 278 382 290 Q 382 302 372 302" stroke="#d4cfc5" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Saucer -->
  <ellipse cx="350" cy="306" rx="28" ry="7" fill="#d4cfc5"/>
  <!-- Steam -->
  <path d="M 345 268 Q 348 260 345 252" stroke="#cccccc" stroke-width="2" fill="none" stroke-linecap="round" opacity="0" class="steam1">
    <animate attributeName="opacity" values="0;0.7;0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="d" values="M 345 268 Q 348 260 345 252;M 345 268 Q 342 260 345 252;M 345 268 Q 348 260 345 252" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 352 266 Q 355 257 352 249" stroke="#cccccc" stroke-width="2" fill="none" stroke-linecap="round" opacity="0" class="steam2">
    <animate attributeName="opacity" values="0;0.5;0" dur="2s" begin="0.7s" repeatCount="indefinite"/>
  </path>
  <path d="M 358 268 Q 361 259 358 251" stroke="#cccccc" stroke-width="2" fill="none" stroke-linecap="round" opacity="0" class="steam3">
    <animate attributeName="opacity" values="0;0.6;0" dur="2s" begin="1.4s" repeatCount="indefinite"/>
  </path>

  <!-- Small notebook/paper on desk -->
  <rect x="30" y="270" width="55" height="38" rx="3" fill="#fffde7" transform="rotate(-5, 57, 289)"/>
  <line x1="35" y1="280" x2="78" y2="279" stroke="#ccc" stroke-width="1" transform="rotate(-5, 57, 289)"/>
  <line x1="35" y1="287" x2="78" y2="286" stroke="#ccc" stroke-width="1" transform="rotate(-5, 57, 289)"/>
  <line x1="35" y1="294" x2="78" y2="293" stroke="#ccc" stroke-width="1" transform="rotate(-5, 57, 289)"/>
  <line x1="35" y1="301" x2="60" y2="300" stroke="#ccc" stroke-width="1" transform="rotate(-5, 57, 289)"/>

  <!-- Subtle bottom label -->
  <text x="200" y="408" font-family="'Courier New', monospace" font-size="10" fill="#888" text-anchor="middle" opacity="0.7">/* Sakshi Patel • Coder Mode: ON */</text>

</svg>
